name: viral-ranker-studio

services:
  backend:
    build:
      context: ./backend
    image: viral-ranker-backend:latest
    container_name: vrs-backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      BGM_SOURCE_DIR: /app/bgm
      # GPU passthrough (nvidia runtime). NVIDIA_VISIBLE_DEVICES=all injects
      # every GPU; the "video" capability exposes the NVENC/NVDEC libraries
      # so ffmpeg can hardware-encode.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    # `runtime: nvidia` is used instead of `deploy.resources.devices`
    # because it works on every Docker + nvidia-container-toolkit setup
    # (legacy AND cdi mode). On hosts without the nvidia runtime, delete
    # this line — rendering then falls back to libx264 automatically.
    runtime: nvidia
    user: "1000:1000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./media:/app/media
      - ./data:/app/data
      - ./bgm:/app/bgm:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    image: viral-ranker-frontend:latest
    container_name: vrs-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      # nginx serves rendered output / thumbnails directly from the shared media dir
      - ./media:/usr/share/nginx/media:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
